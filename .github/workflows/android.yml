name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot Android export
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Install Android SDK packages required by Godot 4.3
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;33.0.2"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME/build-tools"
          ls -la "$ANDROID_HOME/platforms"

      - name: Import and validate project
        run: godot --headless --editor --path . --quit

      - name: Run startup smoke test
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --quit-after 5 2>&1 | tee /tmp/kiwi-startup.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" /tmp/kiwi-startup.log | grep -vE "ERROR: [0-9]+ resources still in use at exit"; then
            echo "Godot startup reported a real runtime or script error."
            exit 1
          fi

      - name: Run physics and combat smoke tests
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --script res://scripts/physics_smoke_test.gd 2>&1 | tee /tmp/kiwi-physics.log
          if grep -E "PHYSICS TEST FAILED|SCRIPT ERROR|Parse Error|ERROR:" /tmp/kiwi-physics.log | grep -vE "ERROR: [0-9]+ resources still in use at exit"; then
            echo "Physics smoke test reported a real runtime or script error."
            exit 1
          fi
          grep -q "PHYSICS TEST PASSED" /tmp/kiwi-physics.log

      - name: Build debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android" build/android/KiwiRounds.apk

      - name: Verify APK
        run: |
          test -s build/android/KiwiRounds.apk
          ls -lh build/android/KiwiRounds.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kiwi-Rounds-Android-APK
          path: build/android/KiwiRounds.apk
          if-no-files-found: error
