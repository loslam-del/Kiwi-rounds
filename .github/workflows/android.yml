name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot Android export
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable

      - name: Install Android SDK build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Import and validate project
        run: godot --headless --editor --path . --quit

      - name: Build debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android" build/android/KiwiRounds.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kiwi-Rounds-Android-APK
          path: build/android/KiwiRounds.apk
          if-no-files-found: error
